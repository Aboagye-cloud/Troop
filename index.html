<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Troop AI</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --sidebar-bg: #111827;
            --chat-bg: #1e293b;
            --user-msg: #0d9488; /* Teal Primary */
            --ai-msg: #334155;
            --text-color: #f8fafc;
            --text-secondary: #94a3b8;
            --input-bg: #0f172a;
            --border-color: #334155;
            --teal-accent: #14b8a6; /* Bright Teal */
            --teal-hover: #0d9488;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .app-container {
            width: 100%;
            max-width: 1100px;
            height: 85vh;
            background: var(--chat-bg);
            border-radius: 16px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
            display: flex;
            overflow: hidden;
            border: 1px solid var(--border-color);
        }

        /* Sidebar for Chat History */
        .sidebar {
            width: 260px;
            background-color: var(--sidebar-bg);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            padding: 16px;
        }

        .new-chat-btn {
            background-color: transparent;
            border: 1px solid var(--teal-accent);
            color: var(--teal-accent);
            padding: 10px 14px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.2s ease;
            margin-bottom: 20px;
        }

        .new-chat-btn:hover {
            background-color: var(--teal-accent);
            color: #0f172a;
        }

        .history-title {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-secondary);
            margin-bottom: 10px;
            font-weight: 600;
        }

        .history-list {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .history-item {
            padding: 10px 12px;
            border-radius: 6px;
            font-size: 0.88rem;
            color: var(--text-secondary);
            cursor: pointer;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            transition: background 0.2s ease, color 0.2s ease;
        }

        .history-item:hover, .history-item.active {
            background-color: var(--ai-msg);
            color: var(--text-color);
        }

        /* Main Chat Area */
        .chat-main {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        /* Header */
        .chat-header {
            padding: 16px 24px;
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .brand-title {
            display: flex;
            flex-direction: column;
        }

        .brand-title h1 {
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--teal-accent);
            line-height: 1.1;
        }

        .brand-title .subtitle {
            font-size: 0.75rem;
            color: var(--text-secondary);
            margin-top: 2px;
            font-weight: 500;
        }

        .status {
            font-size: 0.8rem;
            color: var(--text-secondary);
        }

        /* Messages */
        .messages-list {
            flex: 1;
            padding: 24px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
            scroll-behavior: smooth;
        }

        .message {
            max-width: 80%;
            padding: 12px 18px;
            border-radius: 14px;
            line-height: 1.6;
            font-size: 0.95rem;
            word-wrap: break-word;
            white-space: pre-wrap;
            animation: fadeIn 0.2s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.user {
            align-self: flex-end;
            background-color: var(--user-msg);
            color: #ffffff;
            border-bottom-right-radius: 2px;
        }

        .message.ai {
            align-self: flex-start;
            background-color: var(--ai-msg);
            color: var(--text-color);
            border-bottom-left-radius: 2px;
        }

        /* Typing Dots Animation */
        .typing-indicator {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 12px 18px;
            background-color: var(--ai-msg);
            border-radius: 14px;
            border-bottom-left-radius: 2px;
            width: fit-content;
        }

        .typing-indicator span {
            width: 8px;
            height: 8px;
            background-color: var(--text-secondary);
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out both;
        }

        .typing-indicator span:nth-child(1) { animation-delay: -0.32s; }
        .typing-indicator span:nth-child(2) { animation-delay: -0.16s; }

        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }

        /* Input Area */
        .input-area {
            padding: 16px 20px;
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(10px);
            border-top: 1px solid var(--border-color);
            display: flex;
            gap: 12px;
            align-items: center;
        }

        textarea {
            flex: 1;
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 12px 16px;
            color: var(--text-color);
            font-size: 0.95rem;
            resize: none;
            height: 48px;
            outline: none;
            transition: border-color 0.2s ease;
        }

        textarea:focus {
            border-color: var(--teal-accent);
        }

        button.send-btn {
            padding: 0 20px;
            height: 48px;
            background-color: var(--teal-accent);
            color: #0f172a;
            border: none;
            border-radius: 10px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s ease;
        }

        button.send-btn:hover { background-color: var(--teal-hover); }
        button.send-btn:disabled { opacity: 0.5; cursor: not-allowed; }

        @media (max-width: 768px) {
            .sidebar { display: none; } /* Mobile optimization */
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- History Sidebar -->
        <div class="sidebar">
            <button class="new-chat-btn" onclick="startNewChat()">+ New Chat</button>
            <div class="history-title">Recent Chats</div>
            <div class="history-list" id="historyList">
                <!-- Chat history items will render here dynamically -->
            </div>
        </div>

        <!-- Main Chat UI -->
        <div class="chat-main">
            <!-- Header -->
            <div class="chat-header">
                <div class="brand-title">
                    <h1>Troop AI</h1>
                    <span class="subtitle">created by Aboagye</span>
                </div>
                <span class="status">Powered by Gemini</span>
            </div>

            <!-- Messages List -->
            <div class="messages-list" id="chatList">
                <div class="message ai">Hello! I'm Troop AI. How can I help you today?</div>
            </div>

            <!-- Input Area -->
            <div class="input-area">
                <textarea id="promptInput" placeholder="Type a message... (Press Enter to send)" rows="1"></textarea>
                <button class="send-btn" id="submitBtn" onclick="sendPrompt()">Send</button>
            </div>
        </div>
    </div>

    <script>
        const API_URL = "https://troop-iota.vercel.app";
        const promptInput = document.getElementById("promptInput");
        const chatList = document.getElementById("chatList");
        const submitBtn = document.getElementById("submitBtn");
        const historyList = document.getElementById("historyList");

        let currentSessionId = Date.now();
        let chatHistory = JSON.parse(localStorage.getItem("troop_history")) || {};

        // Keyboard handler
        promptInput.addEventListener("keydown", function(e) {
            if (e.key === "Enter" && !e.shiftKey) {
                e.preventDefault();
                sendPrompt();
            }
        });

        // Initialize UI
        renderHistoryList();

        async function sendPrompt() {
            const prompt = promptInput.value.trim();
            if (!prompt) return;

            // 1. Append User Message
            appendMessage(prompt, 'user');
            saveToHistory('user', prompt);
            promptInput.value = "";

            // 2. Show typing indicator
            const typingIndicator = showTypingIndicator();
            submitBtn.disabled = true;

            try {
                const response = await fetch(`${API_URL}/api/generate`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ prompt: prompt })
                });

                const data = await response.json();
                typingIndicator.remove();

                if (data.result) {
                    appendMessage(data.result, 'ai');
                    saveToHistory('ai', data.result);
                } else {
                    const errText = "Error: " + (data.error || "Failed to parse response.");
                    appendMessage(errText, 'ai');
                    saveToHistory('ai', errText);
                }
            } catch (err) {
                typingIndicator.remove();
                const connErr = "Error connecting to the server. Please try again.";
                appendMessage(connErr, 'ai');
                saveToHistory('ai', connErr);
            } finally {
                submitBtn.disabled = false;
            }
        }

        function appendMessage(text, sender) {
            const msgDiv = document.createElement("div");
            msgDiv.classList.add("message", sender);
            msgDiv.innerText = text;
            chatList.appendChild(msgDiv);
            scrollToBottom();
        }

        function showTypingIndicator() {
            const indicator = document.createElement("div");
            indicator.classList.add("typing-indicator");
            indicator.innerHTML = "<span></span><span></span><span></span>";
            chatList.appendChild(indicator);
            scrollToBottom();
            return indicator;
        }

        function scrollToBottom() {
            chatList.scrollTop = chatList.scrollHeight;
        }

        /* --- History Management --- */
        function saveToHistory(sender, text) {
            if (!chatHistory[currentSessionId]) {
                chatHistory[currentSessionId] = {
                    title: text.substring(0, 24) + "...",
                    messages: []
                };
            }
            chatHistory[currentSessionId].messages.push({ sender, text });
            localStorage.setItem("troop_history", JSON.stringify(chatHistory));
            renderHistoryList();
        }

        function renderHistoryList() {
            historyList.innerHTML = "";
            const keys = Object.keys(chatHistory).reverse();

            keys.forEach(id => {
                const item = document.createElement("div");
                item.classList.add("history-item");
                if (parseInt(id) === currentSessionId) item.classList.add("active");
                item.innerText = chatHistory[id].title || "New Chat";
                item.onclick = () => loadChatSession(id);
                historyList.appendChild(item);
            });
        }

        function loadChatSession(id) {
            currentSessionId = parseInt(id);
            chatList.innerHTML = "";
            const session = chatHistory[id];
            if (session && session.messages) {
                session.messages.forEach(msg => appendMessage(msg.text, msg.sender));
            }
            renderHistoryList();
        }

        function startNewChat() {
            currentSessionId = Date.now();
            chatList.innerHTML = `<div class="message ai">Hello! I'm Troop AI. How can I help you today?</div>`;
            renderHistoryList();
        }
    </script>
</body>
</html>
