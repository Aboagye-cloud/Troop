<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Troop AI</title>
    <!-- Google Fonts, Icons, & Marked.js for Markdown Rendering -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --sidebar-bg: #111827;
            --chat-bg: #1e293b;
            --user-msg: #0d9488; /* Primary Teal */
            --ai-msg: #334155;
            --text-color: #f8fafc;
            --text-secondary: #94a3b8;
            --input-bg: #0f172a;
            --border-color: #334155;
            --teal-accent: #14b8a6; /* Bright Teal */
            --teal-hover: #0d9488;
            --danger-color: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            user-select: text;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--bg-color);
            color: var(--text-color);
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .app-container {
            width: 100%;
            max-width: 1100px;
            height: 90vh;
            background: var(--chat-bg);
            border-radius: 16px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
            display: flex;
            position: relative;
            overflow: hidden;
            border: 1px solid var(--border-color);
        }

        /* Backdrop Overlay for Mobile Drawer */
        .sidebar-overlay {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            z-index: 10;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .sidebar-overlay.active {
            display: block;
            opacity: 1;
        }

        /* Sidebar for Chat History */
        .sidebar {
            width: 280px;
            background-color: var(--sidebar-bg);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            padding: 16px;
            user-select: none;
            z-index: 20;
            transition: transform 0.3s ease;
            flex-shrink: 0;
        }

        .sidebar-header-mobile {
            display: none;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .close-sidebar-btn {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 1.2rem;
            cursor: pointer;
            padding: 8px;
        }

        .new-chat-btn {
            background-color: transparent;
            border: 1px solid var(--teal-accent);
            color: var(--teal-accent);
            padding: 12px 14px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.2s ease;
            margin-bottom: 16px;
        }

        .new-chat-btn:hover {
            background-color: var(--teal-accent);
            color: #0f172a;
        }

        .history-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .history-title {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-secondary);
            font-weight: 600;
        }

        .clear-all-btn {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 0.75rem;
            cursor: pointer;
            transition: color 0.2s ease;
        }

        .clear-all-btn:hover {
            color: var(--danger-color);
        }

        .history-list {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .history-item {
            padding: 10px 12px;
            border-radius: 8px;
            font-size: 0.88rem;
            color: var(--text-secondary);
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: background 0.2s ease, color 0.2s ease;
        }

        .history-item span {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 180px;
        }

        .history-item:hover, .history-item.active {
            background-color: var(--ai-msg);
            color: var(--text-color);
        }

        .delete-single-btn {
            background: none;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            opacity: 0;
            transition: opacity 0.2s ease, color 0.2s ease;
        }

        .history-item:hover .delete-single-btn {
            opacity: 1;
        }

        .delete-single-btn:hover {
            color: var(--danger-color);
        }

        /* Main Chat Area */
        .chat-main {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100%;
            width: 100%;
            position: relative;
            overflow: hidden;
        }

        /* Header */
        .chat-header {
            padding: 12px 16px;
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            user-select: none;
            flex-shrink: 0;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .menu-toggle-btn {
            display: none;
            background: none;
            border: none;
            color: var(--text-color);
            font-size: 1.2rem;
            cursor: pointer;
            padding: 6px;
        }

        .brand-title h1 {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--teal-accent);
            line-height: 1.1;
        }

        .brand-title .subtitle {
            font-size: 0.7rem;
            color: var(--text-secondary);
            margin-top: 2px;
            font-weight: 500;
        }

        .status {
            font-size: 0.75rem;
            color: var(--text-secondary);
        }

        /* Messages List */
        .messages-list {
            flex: 1;
            padding: 16px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
            scroll-behavior: smooth;
            width: 100%;
        }

        .message-wrapper {
            display: flex;
            flex-direction: column;
            max-width: 85%;
        }

        .message-wrapper.user { align-self: flex-end; }
        .message-wrapper.ai { align-self: flex-start; }

        .message {
            padding: 12px 16px;
            border-radius: 14px;
            line-height: 1.5;
            font-size: 0.95rem;
            word-break: break-word;
            overflow-wrap: anywhere;
            position: relative;
            animation: fadeIn 0.2s ease-in-out;
        }

        .message p { margin-bottom: 8px; }
        .message p:last-child { margin-bottom: 0; }
        .message ul, .message ol { margin-left: 18px; margin-bottom: 8px; }
        .message strong { font-weight: 600; color: #ffffff; }

        .message img {
            max-width: 100%;
            max-height: 220px;
            border-radius: 8px;
            margin-bottom: 8px;
            object-fit: contain;
        }

        .message.user {
            background-color: var(--user-msg);
            color: #ffffff;
            border-bottom-right-radius: 2px;
        }

        .message.ai {
            background-color: var(--ai-msg);
            color: var(--text-color);
            border-bottom-left-radius: 2px;
        }

        .message-actions {
            display: flex;
            gap: 8px;
            margin-top: 4px;
            user-select: none;
        }

        .copy-btn {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 0.75rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 2px 4px;
            transition: color 0.2s ease;
        }

        .copy-btn:hover { color: var(--teal-accent); }

        /* Typing Dots Animation */
        .typing-indicator {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 12px 16px;
            background-color: var(--ai-msg);
            border-radius: 14px;
            border-bottom-left-radius: 2px;
            width: fit-content;
        }

        .typing-indicator span {
            width: 8px;
            height: 8px;
            background-color: var(--text-secondary);
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out both;
        }

        .typing-indicator span:nth-child(1) { animation-delay: -0.32s; }
        .typing-indicator span:nth-child(2) { animation-delay: -0.16s; }

        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }

        /* Image Preview Box */
        .image-preview-container {
            display: none;
            padding: 8px 16px 0;
            background: rgba(15, 23, 42, 0.8);
            align-items: center;
            gap: 10px;
            flex-shrink: 0;
        }

        .image-preview-wrapper {
            position: relative;
            display: inline-block;
        }

        .image-preview-wrapper img {
            width: 48px;
            height: 48px;
            object-fit: cover;
            border-radius: 6px;
            border: 1px solid var(--border-color);
        }

        .remove-img-btn {
            position: absolute;
            top: -6px;
            right: -6px;
            background: var(--danger-color);
            color: white;
            border: none;
            border-radius: 50%;
            width: 18px;
            height: 18px;
            font-size: 10px;
            cursor: pointer;
        }

        /* Input Area - Fixed for Mobile */
        .input-area {
            padding: 12px 16px;
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(10px);
            border-top: 1px solid var(--border-color);
            display: flex;
            gap: 8px;
            align-items: center;
            width: 100%;
            flex-shrink: 0;
        }

        .file-upload-label {
            color: var(--text-secondary);
            cursor: pointer;
            padding: 8px;
            border-radius: 8px;
            transition: color 0.2s ease, background 0.2s ease;
            flex-shrink: 0;
        }

        .file-upload-label:hover {
            color: var(--teal-accent);
            background: var(--input-bg);
        }

        input[type="file"] { display: none; }

        textarea {
            flex: 1;
            min-width: 0;
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 10px 14px;
            color: var(--text-color);
            font-size: 0.95rem;
            resize: none;
            max-height: 100px;
            outline: none;
            transition: border-color 0.2s ease;
        }

        textarea:focus { border-color: var(--teal-accent); }

        button.send-btn {
            padding: 0 16px;
            height: 42px;
            background-color: var(--teal-accent);
            color: #0f172a;
            border: none;
            border-radius: 10px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            flex-shrink: 0;
            transition: background 0.2s ease;
        }

        button.send-btn:hover { background-color: var(--teal-hover); }
        button.send-btn:disabled { opacity: 0.5; cursor: not-allowed; }

        /* Mobile and Tablet Specific Rules */
        @media (max-width: 1024px) {
            body {
                padding: 0;
                height: 100dvh;
            }

            .app-container {
                height: 100dvh;
                width: 100vw;
                border-radius: 0;
                border: none;
            }

            .menu-toggle-btn {
                display: block;
            }

            .sidebar {
                position: absolute;
                top: 0;
                left: 0;
                height: 100%;
                width: 280px;
                max-width: 80vw;
                transform: translateX(-100%);
                box-shadow: 5px 0 15px rgba(0,0,0,0.5);
            }

            .sidebar.open {
                transform: translateX(0);
            }

            .sidebar-header-mobile {
                display: flex;
            }

            .message-wrapper {
                max-width: 90%;
            }
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- Backdrop Overlay for Mobile -->
        <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar(false)"></div>

        <!-- History Sidebar -->
        <div class="sidebar" id="sidebar">
            <div class="sidebar-header-mobile">
                <span class="history-title">Menu</span>
                <button class="close-sidebar-btn" onclick="toggleSidebar(false)">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            <button class="new-chat-btn" onclick="startNewChat()">
                <i class="fa-solid fa-plus"></i> New Chat
            </button>
            <div class="history-header">
                <span class="history-title">Recent Chats</span>
                <button class="clear-all-btn" onclick="clearAllHistory()">Clear All</button>
            </div>
            <div class="history-list" id="historyList"></div>
        </div>

        <!-- Main Chat Area -->
        <div class="chat-main">
            <!-- Header -->
            <div class="chat-header">
                <div class="header-left">
                    <button class="menu-toggle-btn" onclick="toggleSidebar(true)" title="Open History">
                        <i class="fa-solid fa-bars"></i>
                    </button>
                    <div class="brand-title">
                        <h1>Troop AI</h1>
                        <span class="subtitle">created by Aboagye</span>
                    </div>
                </div>
                <span class="status">Powered by Gemini</span>
            </div>

            <!-- Messages List -->
            <div class="messages-list" id="chatList">
                <div class="message-wrapper ai">
                    <div class="message ai">Hello! I'm Troop AI. How can I help you today?</div>
                </div>
            </div>

            <!-- Image Preview Box -->
            <div class="image-preview-container" id="imagePreviewContainer">
                <div class="image-preview-wrapper">
                    <img id="imagePreview" src="" alt="Upload Preview">
                    <button class="remove-img-btn" onclick="removeImage()">×</button>
                </div>
            </div>

            <!-- Input Area -->
            <div class="input-area">
                <label for="imageInput" class="file-upload-label" title="Attach an image">
                    <i class="fa-solid fa-paperclip"></i>
                </label>
                <input type="file" id="imageInput" accept="image/*" onchange="handleImageSelect(event)">
                <textarea id="promptInput" placeholder="Type a message..." rows="1"></textarea>
                <button class="send-btn" id="submitBtn" onclick="sendPrompt()">Send</button>
            </div>
        </div>
    </div>

    <script>
        const API_URL = "https://troop-iota.vercel.app";
        const promptInput = document.getElementById("promptInput");
        const chatList = document.getElementById("chatList");
        const submitBtn = document.getElementById("submitBtn");
        const historyList = document.getElementById("historyList");
        const imageInput = document.getElementById("imageInput");
        const imagePreviewContainer = document.getElementById("imagePreviewContainer");
        const imagePreview = document.getElementById("imagePreview");
        const sidebar = document.getElementById("sidebar");
        const sidebarOverlay = document.getElementById("sidebarOverlay");

        let currentSessionId = Date.now();
        let chatHistory = JSON.parse(localStorage.getItem("troop_history")) || {};
        let selectedBase64Image = null;

        // Mobile Sidebar Slide Drawer Toggle
        function toggleSidebar(open) {
            if (open) {
                sidebar.classList.add("open");
                sidebarOverlay.classList.add("active");
            } else {
                sidebar.classList.remove("open");
                sidebarOverlay.classList.remove("active");
            }
        }

        // Auto-expand textarea & Enter-to-send listener
        promptInput.addEventListener("input", function() {
            this.style.height = "auto";
            this.style.height = (this.scrollHeight) + "px";
        });

        promptInput.addEventListener("keydown", function(e) {
            if (e.key === "Enter" && !e.shiftKey) {
                e.preventDefault();
                sendPrompt();
            }
        });

        renderHistoryList();

        function handleImageSelect(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                selectedBase64Image = e.target.result;
                imagePreview.src = selectedBase64Image;
                imagePreviewContainer.style.display = "flex";
            };
            reader.readAsDataURL(file);
        }

        function removeImage() {
            selectedBase64Image = null;
            imageInput.value = "";
            imagePreviewContainer.style.display = "none";
        }

        async function sendPrompt() {
            const prompt = promptInput.value.trim();
            if (!prompt && !selectedBase64Image) return;

            const userImageData = selectedBase64Image;
            appendMessage(prompt, 'user', userImageData);
            saveToHistory('user', prompt, userImageData);

            promptInput.value = "";
            promptInput.style.height = "auto";
            removeImage();

            const typingIndicator = showTypingIndicator();
            submitBtn.disabled = true;

            const currentHistory = chatHistory[currentSessionId]?.messages || [];

            try {
                const response = await fetch(`${API_URL}/api/generate`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        prompt: prompt,
                        image: userImageData,
                        history: currentHistory
                    })
                });

                const data = await response.json();
                typingIndicator.remove();

                if (data.result) {
                    appendMessage(data.result, 'ai');
                    saveToHistory('ai', data.result);
                } else {
                    const errText = "Error: " + (data.error || "Failed to generate response.");
                    appendMessage(errText, 'ai');
                    saveToHistory('ai', errText);
                }
            } catch (err) {
                typingIndicator.remove();
                const connErr = "Error connecting to the server. Please try again.";
                appendMessage(connErr, 'ai');
                saveToHistory('ai', connErr);
            } finally {
                submitBtn.disabled = false;
            }
        }

        function appendMessage(text, sender, imageSrc = null) {
            const wrapper = document.createElement("div");
            wrapper.classList.add("message-wrapper", sender);

            const msgDiv = document.createElement("div");
            msgDiv.classList.add("message", sender);

            if (imageSrc) {
                const img = document.createElement("img");
                img.src = imageSrc;
                msgDiv.appendChild(img);
            }

            if (text) {
                const contentDiv = document.createElement("div");
                if (sender === 'ai') {
                    contentDiv.innerHTML = marked.parse(text);
                } else {
                    contentDiv.innerText = text;
                }
                msgDiv.appendChild(contentDiv);
            }

            wrapper.appendChild(msgDiv);

            // Copy Button for AI responses
            if (sender === 'ai') {
                const actionsDiv = document.createElement("div");
                actionsDiv.classList.add("message-actions");
                actionsDiv.innerHTML = `
                    <button class="copy-btn" onclick="copyText(this)">
                        <i class="fa-regular fa-copy"></i> Copy
                    </button>
                `;
                wrapper.appendChild(actionsDiv);
            }

            chatList.appendChild(wrapper);
            scrollToBottom();
        }

        function copyText(btn) {
            const wrapper = btn.closest(".message-wrapper");
            const textToCopy = wrapper.querySelector(".message").innerText;
            navigator.clipboard.writeText(textToCopy).then(() => {
                btn.innerHTML = `<i class="fa-solid fa-check"></i> Copied!`;
                setTimeout(() => {
                    btn.innerHTML = `<i class="fa-regular fa-copy"></i> Copy`;
                }, 2000);
            });
        }

        function showTypingIndicator() {
            const indicator = document.createElement("div");
            indicator.classList.add("typing-indicator");
            indicator.innerHTML = "<span></span><span></span><span></span>";
            chatList.appendChild(indicator);
            scrollToBottom();
            return indicator;
        }

        function scrollToBottom() {
            chatList.scrollTop = chatList.scrollHeight;
        }

        /* History Functions */
        function saveToHistory(sender, text, image = null) {
            if (!chatHistory[currentSessionId]) {
                chatHistory[currentSessionId] = {
                    title: text ? text.substring(0, 24) + "..." : "Image Query",
                    messages: []
                };
            }
            chatHistory[currentSessionId].messages.push({ sender, text, image });
            localStorage.setItem("troop_history", JSON.stringify(chatHistory));
            renderHistoryList();
        }

        function renderHistoryList() {
            historyList.innerHTML = "";
            const keys = Object.keys(chatHistory).reverse();

            keys.forEach(id => {
                const item = document.createElement("div");
                item.classList.add("history-item");
                if (parseInt(id) === currentSessionId) item.classList.add("active");

                item.innerHTML = `
                    <span onclick="loadChatSession(${id})">${chatHistory[id].title || "Chat"}</span>
                    <button class="delete-single-btn" onclick="deleteSession(event, ${id})">
                        <i class="fa-solid fa-trash"></i>
                    </button>
                `;
                historyList.appendChild(item);
            });
        }

        function loadChatSession(id) {
            currentSessionId = parseInt(id);
            chatList.innerHTML = "";
            const session = chatHistory[id];
            if (session && session.messages) {
                session.messages.forEach(msg => appendMessage(msg.text, msg.sender, msg.image));
            }
            renderHistoryList();
            toggleSidebar(false);
        }

        function startNewChat() {
            currentSessionId = Date.now();
            chatList.innerHTML = `
                <div class="message-wrapper ai">
                    <div class="message ai">Hello! I'm Troop AI. How can I help you today?</div>
                </div>
            `;
            renderHistoryList();
            toggleSidebar(false);
        }

        function deleteSession(event, id) {
            event.stopPropagation();
            delete chatHistory[id];
            localStorage.setItem("troop_history", JSON.stringify(chatHistory));
            if (currentSessionId === id) startNewChat();
            else renderHistoryList();
        }

        function clearAllHistory() {
            if (confirm("Delete all chat history?")) {
                chatHistory = {};
                localStorage.removeItem("troop_history");
                startNewChat();
            }
        }
    </script>
</body>
</html>
