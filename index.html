<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Troop AI</title>
    <!-- Google Fonts for modern typography -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --chat-bg: #1e293b;
            --user-msg: #2563eb;
            --ai-msg: #334155;
            --text-color: #f8fafc;
            --text-secondary: #94a3b8;
            --input-bg: #0f172a;
            --border-color: #334155;
            --accent: #38bdf8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .chat-container {
            width: 100%;
            max-width: 800px;
            height: 90vh;
            background: var(--chat-bg);
            border-radius: 16px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 1px solid var(--border-color);
        }

        /* Header */
        .chat-header {
            padding: 20px;
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .chat-header h1 {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--accent);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .chat-header span.status {
            font-size: 0.8rem;
            color: var(--text-secondary);
            font-weight: 400;
        }

        /* Message Area */
        .messages-list {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
            scroll-behavior: smooth;
        }

        .message {
            max-width: 80%;
            padding: 12px 18px;
            border-radius: 14px;
            line-height: 1.6;
            font-size: 0.95rem;
            word-wrap: break-word;
            white-space: pre-wrap;
            animation: fadeIn 0.2s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.user {
            align-self: flex-end;
            background-color: var(--user-msg);
            color: #ffffff;
            border-bottom-right-radius: 2px;
        }

        .message.ai {
            align-self: flex-start;
            background-color: var(--ai-msg);
            color: var(--text-color);
            border-bottom-left-radius: 2px;
        }

        /* Typing Dots Animation */
        .typing-indicator {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 12px 18px;
            background-color: var(--ai-msg);
            border-radius: 14px;
            border-bottom-left-radius: 2px;
            width: fit-content;
        }

        .typing-indicator span {
            width: 8px;
            height: 8px;
            background-color: var(--text-secondary);
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out both;
        }

        .typing-indicator span:nth-child(1) { animation-delay: -0.32s; }
        .typing-indicator span:nth-child(2) { animation-delay: -0.16s; }

        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }

        /* Input Footer */
        .input-area {
            padding: 16px 20px;
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(10px);
            border-top: 1px solid var(--border-color);
            display: flex;
            gap: 12px;
            align-items: center;
        }

        textarea {
            flex: 1;
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 12px 16px;
            color: var(--text-color);
            font-size: 0.95rem;
            resize: none;
            height: 48px;
            outline: none;
            transition: border-color 0.2s ease;
        }

        textarea:focus {
            border-color: var(--accent);
        }

        button {
            padding: 0 20px;
            height: 48px;
            background-color: var(--accent);
            color: #0f172a;
            border: none;
            border-radius: 10px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s ease;
        }

        button:hover { opacity: 0.9; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
    </style>
</head>
<body>

    <div class="chat-container">
        <!-- Header -->
        <div class="chat-header">
            <h1>Troop AI</h1>
            <span class="status">Powered by Gemini</span>
        </div>

        <!-- Chat History Container -->
        <div class="messages-list" id="chatList">
            <div class="message ai">Hello! I'm Troop AI. How can I help you today?</div>
        </div>

        <!-- Input Box -->
        <div class="input-area">
            <textarea id="promptInput" placeholder="Type a message... (Press Enter to send)" rows="1"></textarea>
            <button id="submitBtn" onclick="sendPrompt()">Send</button>
        </div>
    </div>

    <script>
        const API_URL = "https://troop-iota.vercel.app";
        const promptInput = document.getElementById("promptInput");
        const chatList = document.getElementById("chatList");
        const submitBtn = document.getElementById("submitBtn");

        // Allow pressing 'Enter' to send (Shift + Enter for a new line)
        promptInput.addEventListener("keydown", function(e) {
            if (e.key === "Enter" && !e.shiftKey) {
                e.preventDefault();
                sendPrompt();
            }
        });

        async function sendPrompt() {
            const prompt = promptInput.value.trim();
            if (!prompt) return;

            // 1. Append User Message
            appendMessage(prompt, 'user');
            promptInput.value = "";

            // 2. Add Typing Indicator
            const typingIndicator = showTypingIndicator();
            submitBtn.disabled = true;

            try {
                const response = await fetch(`${API_URL}/api/generate`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ prompt: prompt })
                });

                const data = await response.json();
                
                // Remove typing indicator before appending response
                typingIndicator.remove();

                if (data.result) {
                    appendMessage(data.result, 'ai');
                } else {
                    appendMessage("Error: " + (data.error || "Failed to parse response."), 'ai');
                }
            } catch (err) {
                typingIndicator.remove();
                appendMessage("Error connecting to the server. Please try again.", 'ai');
            } finally {
                submitBtn.disabled = false;
            }
        }

        function appendMessage(text, sender) {
            const msgDiv = document.createElement("div");
            msgDiv.classList.add("message", sender);
            msgDiv.innerText = text;
            chatList.appendChild(msgDiv);
            scrollToBottom();
        }

        function showTypingIndicator() {
            const indicator = document.createElement("div");
            indicator.classList.add("typing-indicator");
            indicator.innerHTML = "<span></span><span></span><span></span>";
            chatList.appendChild(indicator);
            scrollToBottom();
            return indicator;
        }

        function scrollToBottom() {
            chatList.scrollTop = chatList.scrollHeight;
        }
    </script>
</body>
</html>
